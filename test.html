<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test vidéo</title>
<style>body{font-family:-apple-system,sans-serif;margin:20px;background:#eee}div{display:inline-block;margin:10px;vertical-align:top;text-align:center}video{width:200px;height:356px;background:#000;display:block}p{font-size:20px;font-weight:700}</style></head><body>
<h2>Test vidéo – envoie une photo de cette page</h2>
<div><p>1</p><video src="media/kanha-0-m.mp4" autoplay muted loop playsinline controls></video></div>
<div><p>2</p><video src="media/kanha-0-m.mp4?v=1" autoplay muted loop playsinline controls></video></div>
<div><p>3</p><span id="c3"></span></div>
<div><p>4</p><video src="media/begude-entier.mp4" controls playsinline preload="metadata"></video></div>
<pre id="log" style="font-size:14px"></pre>
<script>
var v=document.createElement('video');v.setAttribute('src','media/kanha-0-m.mp4');['autoplay','muted','loop','playsinline'].forEach(function(a){v.setAttribute(a,'')});v.muted=true;document.getElementById('c3').appendChild(v);var p=v.play();if(p&&p.catch)p.catch(function(e){log('3 play: '+e.name)});
function log(t){document.getElementById('log').textContent+=t+'\n'}
setTimeout(function(){document.querySelectorAll('video').forEach(function(x,i){log((i+1)+': readyState='+x.readyState+' paused='+x.paused+' error='+(x.error?x.error.code:'-'))})},4000);
</script></body></html>

<style>
body{margin:0;background:#EEF6F1;color:#0E2A22;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}

.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
h1,h2,h3,p{text-wrap:pretty}

@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes floatTilt{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-18px) rotate(calc(var(--r,0deg) + 2deg))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,247,240,.75)}70%{box-shadow:0 0 0 22px rgba(251,247,240,0)}100%{box-shadow:0 0 0 0 rgba(251,247,240,0)}}
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes waveX{to{transform:translateX(-50%)}}
@keyframes heartUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-170px) scale(1.15)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes blink{50%{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sunGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes chipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes heroIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes growLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.float{animation:floatY 6s ease-in-out infinite}
.float.d1{animation-delay:-1.5s;animation-duration:7s}
.float.d2{animation-delay:-3s;animation-duration:8s}
.float.d3{animation-delay:-4.5s;animation-duration:6.5s}
.tilt{animation:floatTilt 7s ease-in-out infinite}
.tilt.d1{animation-delay:-2s}
.tilt.d2{animation-delay:-4s}
.spin{animation:spin 26s linear infinite}
.spin.slow{animation-duration:60s}
.sun{animation:sunGlow 7s ease-in-out infinite}
.marquee{animation:marquee 38s linear infinite}
.marquee:hover{animation-play-state:paused}
.wave{animation:waveX 14s linear infinite}
.wave.b{animation-duration:22s;animation-direction:reverse}
.heart{animation:heartUp 3.6s ease-out infinite;opacity:0}
.heart.d1{animation-delay:1.2s}
.heart.d2{animation-delay:2.4s}
.pulse{animation:pulse 2.2s ease-out infinite}
.caret{animation:blink 1s steps(1) infinite}
.route{stroke-dasharray:6 8;animation:dash 2.4s linear infinite}
.chip{animation:chipFloat 5s ease-in-out infinite}
.chip:nth-child(2n){animation-delay:-1.4s}
.chip:nth-child(3n){animation-delay:-2.8s}
.hero-in{animation:heroIn 1.1s cubic-bezier(.2,.7,.2,1) both}
.hero-in.d1{animation-delay:.15s}.hero-in.d2{animation-delay:.3s}.hero-in.d3{animation-delay:.45s}.hero-in.d4{animation-delay:.6s}
.word{transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.pop{animation:popIn .45s cubic-bezier(.2,.7,.2,1) both}
.overlay{animation:fadeIn .3s ease both}

@supports (animation-timeline: view()){
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
  .para{animation:paraDown linear both;animation-timeline:scroll(root);animation-range:0 900px}
  .para.up{animation-name:paraUp}
  .toTop{animation:fadeIn linear both;animation-timeline:scroll(root);animation-range:500px 800px}
  .line-grow{transform-origin:left;animation:growLine linear both;animation-timeline:view();animation-range:entry 20% cover 45%}
}
@keyframes paraDown{to{transform:translateY(180px)}}
@keyframes paraUp{to{transform:translateY(-120px)}}

.card{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease}
.card:hover,.card:focus-visible{transform:translateY(-8px);box-shadow:0 26px 50px -22px rgba(14,42,34,.45)}
.card .media-in{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .media-in{transform:scale(1.06)}
.card .more{transition:letter-spacing .3s ease,color .3s ease}
.card:hover .more{letter-spacing:.06em;color:#064E4B}
.tile{transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s ease}
.tile:hover,.tile:focus-visible{transform:scale(1.03);filter:saturate(1.15)}
.btn{transition:transform .25s ease,background-color .25s ease,color .25s ease}
.btn:hover{transform:translateY(-2px)}
.btn-dark:hover{background-color:#064E4B !important;color:#FAFCF8 !important}
.btn-light:hover{background-color:#0E2A22 !important;color:#FAFCF8 !important}
.tab{transition:background-color .3s ease,color .3s ease,transform .25s ease}
.tab:hover{transform:translateY(-2px)}
.svc{transition:transform .4s cubic-bezier(.2,.7,.2,1),background-color .4s ease}
.svc:hover{transform:translateY(-6px);background-color:#FFFFFF !important}
.svc:hover .svc-ic{transform:rotate(-8deg) scale(1.08)}
.svc-ic{transition:transform .4s ease}
.nav a{text-decoration:none;color:#0E2A22;position:relative}
.nav a.ul::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;background:#08716E;transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.nav a.ul:hover::after{transform:scaleX(1)}
button{font:inherit}
:focus-visible{outline:3px solid #0C4A3E;outline-offset:3px}

.dot .dot-label{opacity:0;transform:translateX(6px);transition:all .25s ease;pointer-events:none}
.dot:hover .dot-label,.dot:focus-visible .dot-label{opacity:1;transform:none}
.bounce{animation:bnc 1.6s ease-in-out infinite}
@keyframes bnc{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.nextbtn:hover{background:#7FE0D4 !important}
section > div:not([aria-hidden]), section > ol, footer > *{position:relative;z-index:2}
.decor{z-index:0 !important}
@media (max-width: 900px){.decor{opacity:.35 !important}.decor img{max-width:140px}}
.clink{transition:background-color .25s ease, transform .25s ease}
.clink:hover{background-color:rgba(250,252,248,.3) !important;transform:translateY(-2px)}
@media (max-width: 700px){.dots{display:none !important}}
.eq{transform-origin:bottom;animation:eqb .9s ease-in-out infinite alternate}
.eq.e2{animation-delay:-.3s}.eq.e3{animation-delay:-.6s}.eq.e4{animation-delay:-.15s}
.eq.off{animation:none;opacity:.7}
@keyframes eqb{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.fadeimg{animation:fadeIn .4s ease both}
.tilt video{pointer-events:none}
.sway{transform-origin:var(--o,50% 100%);animation:sway 7s ease-in-out infinite;will-change:transform}
@keyframes sway{0%,100%{transform:rotate(var(--a0,-3deg))}50%{transform:rotate(var(--a1,4deg))}}
.palmsway{transform-origin:150px 135px;animation:palm 5s ease-in-out infinite}
@keyframes palm{0%,100%{transform:rotate(-3deg)}35%{transform:rotate(4deg) skewX(2deg)}70%{transform:rotate(-1deg)}}
.drift{position:absolute;top:-60px;animation:drift 17s linear infinite;opacity:.85}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(60px,220px) rotate(80deg)}50%{transform:translate(-20px,450px) rotate(160deg)}75%{transform:translate(70px,680px) rotate(250deg)}100%{transform:translate(10px,940px) rotate(340deg)}}
.swim{animation:swim 26s linear infinite;will-change:transform}
.swim.s2{animation-name:swim2;animation-duration:38s;animation-delay:-14s}
@keyframes swim2{0%{transform:translateX(calc(100vw + 300px)) rotate(-90deg)}50%{transform:translateX(50vw) translateY(-25px) rotate(-84deg)}100%{transform:translateX(-300px) rotate(-90deg)}}
.swim.s3{animation-duration:30s}
@keyframes swim{0%{transform:translateX(-300px) translateY(0) rotate(90deg)}25%{transform:translateX(25vw) translateY(-30px) rotate(84deg)}50%{transform:translateX(50vw) translateY(20px) rotate(96deg)}75%{transform:translateX(75vw) translateY(-20px) rotate(86deg)}100%{transform:translateX(calc(100vw + 300px)) translateY(0) rotate(90deg)}}
.mantabob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.mantawing{transform-origin:100px 70px;animation:flap 3s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8) scaleY(1.04)}}
.school{animation:school 22s linear infinite}
@keyframes school{0%{transform:translateX(110vw)}100%{transform:translateX(-300px)}}
.bubble{position:absolute;bottom:-20px;width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);animation:bubble 9s ease-in infinite}
.bubble.b2{width:6px;height:6px;animation-duration:7s;animation-delay:-2s}
.bubble.b3{width:14px;height:14px;animation-duration:11s;animation-delay:-6s}
@keyframes bubble{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(14px,-45vh)}100%{transform:translate(-8px,-95vh);opacity:0}}
.caustics{background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 60px,rgba(180,255,245,.10) 60px 90px,rgba(255,255,255,0) 90px 170px);transform-origin:50% 0;animation:rays 9s ease-in-out infinite alternate;mask-image:linear-gradient(180deg,#000,transparent);-webkit-mask-image:linear-gradient(180deg,#000,transparent)}
@keyframes rays{from{transform:skewX(-8deg) translateX(-40px)}to{transform:skewX(8deg) translateX(40px)}}
.sunrays{background:repeating-conic-gradient(from 200deg at 70% 0%,rgba(255,240,200,.12) 0 4deg,rgba(255,240,200,0) 4deg 12deg);mask-image:radial-gradient(circle at 70% 0%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(circle at 70% 0%,#000 10%,transparent 70%);animation:rays 12s ease-in-out infinite alternate}
.herobg{animation:herozoom 30s ease-in-out infinite alternate}
@keyframes herozoom{from{transform:scale(1)}to{transform:scale(1.08)}}
.btn-aqua:hover{background-color:#FAFCF8 !important;color:#0A2A22 !important}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1s ease, transform 6s ease}
.clickme{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.tap{animation:tap 1.8s ease-in-out infinite}
@keyframes tap{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
.exp{transition:transform .3s ease, background-color .3s ease, color .3s ease}
.exp:hover{transform:translateY(-4px) scale(1.04);background-color:#0E2A22 !important;color:#FAFCF8 !important}
.shade{mix-blend-mode:multiply}
.gust{animation:gust 11s ease-in-out infinite;will-change:transform}
.flutter{animation:flutter 3.1s ease-in-out infinite}
@keyframes gust{0%{transform:rotate(0) skewX(0)}14%{transform:rotate(1.6deg) skewX(1deg)}24%{transform:rotate(-.4deg) skewX(-.3deg)}38%{transform:rotate(1deg) skewX(.6deg)}52%{transform:rotate(3deg) skewX(2.2deg)}60%{transform:rotate(1.2deg) skewX(.8deg)}68%{transform:rotate(2.4deg) skewX(1.6deg)}82%{transform:rotate(.2deg)}100%{transform:rotate(0) skewX(0)}}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(2px,-1px) rotate(.5deg)}60%{transform:translate(-1px,1px) rotate(-.4deg)}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
@media (max-width:700px){.pgrid{grid-template-columns:repeat(3,1fr);gap:6px}.vgrid{grid-template-columns:repeat(2,1fr);gap:8px}.ptile,.reel{border-radius:10px !important}}
.ptile img{transition:transform .5s ease}.ptile:hover img{transform:scale(1.06)}
.reel{transition:transform .3s ease}
.reel:hover{transform:translateY(-4px)}
@media (max-width: 700px){.shade{opacity:.16 !important}.shade img{max-width:85vw !important}}
@media (prefers-reduced-motion: reduce){.gust,.flutter{animation:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .heart{opacity:0 !important}
  .reveal{opacity:1 !important;transform:none !important}
}
</style>

<style>*{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.herobg{animation:none!important}[class*=shade] img,[class*=shade]{will-change:transform}</style>
<script>(function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting){if(v.paused&&v.autoplay){v.muted=true;var p=v.play();if(p&&p.catch)p.catch(function(){});}}else if(!v.closest("[role=dialog]")){v.pause();}});},{threshold:0.05});function scan(){document.querySelectorAll("video").forEach(function(v){if(!v.__io){v.__io=1;io.observe(v);}});}function kick(){document.querySelectorAll("video[autoplay]").forEach(function(v){var r=v.getBoundingClientRect();if(v.paused&&r.bottom>0&&r.top<innerHeight){v.muted=v.closest("[role=dialog]")?v.muted:true;var p=v.play();if(p&&p.catch)p.catch(function(){});}});}new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});window.addEventListener("load",scan);scan();["pointerdown","touchstart","keydown"].forEach(function(e){window.addEventListener(e,kick,{passive:true});});})();</script>
